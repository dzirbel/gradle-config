[versions]
dependency-analysis = "3.19.1"
gradle-foojay = "1.0.0"
kotlin-api = "2.4.0"
sort-dependencies = "0.21.0"
spotless = "8.10.2"

[libraries]
dependency-analysis-plugin = { module = "com.autonomousapps.build-health:com.autonomousapps.build-health.gradle.plugin", version.ref = "dependency-analysis" }
gradle-foojay-plugin = { module = "org.gradle.toolchains.foojay-resolver-convention:org.gradle.toolchains.foojay-resolver-convention.gradle.plugin", version.ref = "gradle-foojay" }
kotlin-gradle-plugin-api = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin-api", version.ref = "kotlin-api" }
sort-dependencies-plugin = { module = "com.squareup:sort-dependencies-gradle-plugin", version.ref = "sort-dependencies" }
spotless-plugin = { module = "com.diffplug.spotless:spotless-plugin-gradle", version.ref = "spotless" }
